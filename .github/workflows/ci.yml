name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      # golangci-lint needs no install step: gate.yml pins it on the lint check
      # (golangci_version), and the gate runs that release via `go run`.

      # Build the gate from source — the repo gates itself with its own binary.
      - name: build corpos-gate
        run: go build -o "$HOME/.local/bin/corpos-gate" ./cmd/corpos-gate

      - name: put corpos-gate on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: gate this repo with corpos-gate
        run: corpos-gate run --tier=pre-push
